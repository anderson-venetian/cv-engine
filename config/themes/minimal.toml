[meta]
name    = "minimal"
version = "1.1.0"

[page]
size          = "a4"
orientation   = "portrait"
margin_top    = "1.5cm"
margin_bottom = "1.5cm"
margin_left   = "1.8cm"
margin_right  = "1.8cm"

[typography]
base_size       = "11pt"
font_package    = "XCharter"
font_family     = "Charter"
line_height     = "1.12"
heading_weight  = "bold"
name_size_scale = "LARGE"

[colors]
primary   = "#1a1a1a"
secondary = "#4a4a4a"
accent    = "#0a2540"
divider   = "#aaaaaa"

[dividers]
style       = "solid"
thickness   = "0.5pt"
space_above = "4pt"
space_below = "6pt"

[sections]
title_case    = "upper"
title_bold    = true
space_between = "6pt"
